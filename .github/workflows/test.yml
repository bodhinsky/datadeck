name: test
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: brew install rsync
      - run: npm ci
      - name: Unit + integration (Homebrew rsync)
        run: PATH="$(brew --prefix)/bin:$PATH" npm test
      - name: End-to-end (real app)
        run: PATH="$(brew --prefix)/bin:$PATH" npm run test:e2e
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y rsync xvfb
      - run: npm ci
      - run: npm test
      - run: xvfb-run -a npm run test:e2e
